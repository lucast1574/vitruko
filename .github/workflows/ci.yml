name: Vitruko checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vitruko_test
          POSTGRES_USER: vitruko
          POSTGRES_PASSWORD: ci-isolated-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vitruko -d vitruko_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vitruko:ci-isolated-password@localhost:5432/vitruko_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web audit --omit=dev
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/api
